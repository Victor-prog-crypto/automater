<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Shop, scan, save and track with Automater." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Automater · Retail, reimagined</title>
  </head>
  <body class="bg-stone-100 text-slate-950 antialiased">
    <div id="app" class="mx-auto min-h-dvh max-w-3xl bg-stone-50 shadow-2xl shadow-slate-900/10">
      <header id="app-header" class="sticky top-0 z-40 border-b border-stone-200/80 bg-stone-50/95 px-5 backdrop-blur-xl">
        <div class="relative flex h-[4.5rem] items-center justify-between pt-safe">
          <a href="#market" class="flex items-center gap-2.5" aria-label="Automater Market">
            <span class="grid size-10 place-items-center rounded-2xl bg-slate-900 text-stone-50 shadow-md shadow-slate-900/10">
              <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-[1.9]" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9l1.6-5h14.8L21 9" />
                <path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0" />
                <path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7" />
                <path d="M9.5 20v-5h5v5" />
              </svg>
            </span>
            <span><strong class="block text-[15px] leading-none tracking-[-.03em]">automater</strong><span id="header-subtitle" class="mt-1 block text-[10px] font-bold uppercase tracking-[.18em] text-slate-400">Retail, reimagined</span></span>
          </a>
          <div class="relative flex items-center gap-2">
            <button id="header-search-button" type="button" class="grid size-11 place-items-center rounded-2xl bg-stone-100/90 text-slate-700 shadow-2xs ring-1 ring-stone-200/90 transition hover:bg-stone-200/70 active:scale-95" aria-label="Search Products" title="Search Products">
              <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><line x1="20" y1="20" x2="16.35" y2="16.35"/></svg>
            </button>
            <button id="header-camera-button" type="button" class="grid size-11 place-items-center rounded-2xl bg-[#edf3ee] text-[#2b5440] shadow-2xs ring-1 ring-[#d5e2d8] transition hover:bg-[#e3ede5] active:scale-95" aria-label="Open Camera Barcode Scanner" title="Scan Barcode">
              <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <button id="header-cart-button" type="button" class="relative flex h-11 items-center gap-2 rounded-2xl bg-white px-3 text-slate-800 shadow-xs ring-1 ring-stone-200/90 transition hover:ring-slate-300 active:scale-95" aria-label="Open Trolley" title="Open Trolley">
              <span class="relative grid place-items-center">
                <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" aria-hidden="true"><path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L20 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
                <span id="header-cart-count" class="absolute -right-2 -top-2 hidden min-w-[1.2rem] rounded-full bg-[#234e3b] px-1 py-0.2 text-center text-[9.5px] font-black text-white shadow-xs ring-2 ring-stone-50">0</span>
              </span>
              <span id="header-cart-total" class="hidden text-xs font-black tracking-tight tabular-nums">R 0,00</span>
              <span id="header-cart-plus" class="pointer-events-none absolute -bottom-2 right-2 hidden rounded-full bg-[#234e3b] px-1.5 py-0.5 text-[9px] font-black text-white shadow-sm">+1</span>
            </button>
            <div id="floating-trolley-callout" class="pointer-events-none absolute right-0 top-[3.35rem] z-50 hidden w-68 origin-top-right"></div>
          </div>
        </div>
        <div id="global-search-drawer" class="hidden pb-3 pt-1"></div>
      </header>

      <main id="screen" class="min-h-[calc(100dvh-9.75rem)] pb-28" aria-live="polite"></main>

      <nav class="fixed inset-x-0 bottom-0 z-40 mx-auto max-w-3xl border-t border-stone-200/80 bg-white/95 px-2 pb-safe shadow-[0_-14px_40px_-28px_rgba(15,23,42,.35)] backdrop-blur-xl" aria-label="Primary navigation">
        <div class="grid h-[5rem] grid-cols-3 items-center">
          <button class="nav-item" type="button" data-route="market" aria-label="Market">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l1.6-5h14.8L21 9" />
                <path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0" />
                <path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7" />
                <path d="M9.5 20v-5h5v5" />
              </svg>
            </span>
            <span>Market</span>
          </button>
          <button class="nav-item" type="button" data-route="tracker" aria-label="Order tracker"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span>Tracker</span></button>
          <button class="nav-item" type="button" data-route="savings" aria-label="Savings"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 12 12 20l-8-8V4h8l8 8Z"/><circle cx="8.5" cy="8.5" r="1.2"/></svg></span><span>Savings</span></button>
        </div>
      </nav>

      <div id="modal-root"></div>
      <div id="toast" class="pointer-events-none fixed inset-x-4 top-24 z-[70] mx-auto hidden max-w-sm -translate-y-2 rounded-2xl bg-slate-950 px-4 py-3 text-sm font-bold text-white opacity-0 shadow-2xl transition-all" role="alert" aria-live="assertive"></div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
