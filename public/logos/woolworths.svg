<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ww-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="360" height="100" rx="18" fill="url(#ww-black)"/>
  
  <!-- Subtle Silver/Platinum Border Ring -->
  <rect x="6" y="6" width="348" height="88" rx="14" fill="none" stroke="#e4e4e7" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Modern Clean WOOLWORTHS Wordmark -->
  <text x="180" y="56" 
        fill="#ffffff" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="800" 
        font-size="34" 
        letter-spacing="5" 
        text-anchor="middle">WOOLWORTHS</text>
  
  <!-- WRewards / The Difference Tagline -->
  <text x="180" y="78" 
        fill="#a1a1aa" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-weight="700" 
        font-size="9" 
        letter-spacing="4" 
        text-anchor="middle">THE DIFFERENCE &bull; WREWARDS</text>
</svg>
