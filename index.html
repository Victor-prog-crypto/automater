<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Shop, scan, save and track with Automater." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Automater · Retail, reimagined</title>
  </head>
  <body class="bg-stone-100 text-slate-950 antialiased">
    <div id="app" class="mx-auto min-h-dvh max-w-3xl bg-stone-50 shadow-2xl shadow-slate-900/10">
      <header id="app-header" class="sticky top-0 z-30 border-b border-slate-200/70 bg-stone-50/90 px-5 backdrop-blur-xl">
        <div class="flex h-[4.5rem] items-center justify-between pt-safe">
          <a href="#market" class="flex items-center gap-2.5" aria-label="Automater Market">
            <span class="grid size-10 place-items-center rounded-2xl bg-slate-950 text-white shadow-lg shadow-slate-900/15"><svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" aria-hidden="true"><path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L20 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg></span>
            <span><strong class="block text-[15px] leading-none tracking-[-.03em]">automater</strong><span id="header-subtitle" class="mt-1 block text-[10px] font-bold uppercase tracking-[.18em] text-slate-400">Retail, reimagined</span></span>
          </a>
          <div class="flex items-center gap-2">
            <button id="header-download-button" type="button" class="grid size-11 place-items-center rounded-2xl bg-violet-50 text-violet-700 shadow-sm ring-1 ring-violet-200 transition active:scale-95" aria-label="Download / Install Automater App" title="Download & Install App">
              <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button id="header-camera-button" type="button" class="grid size-11 place-items-center rounded-2xl bg-emerald-50 text-emerald-700 shadow-sm ring-1 ring-emerald-200 transition active:scale-95" aria-label="Open Camera Barcode Scanner">
              <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <button id="header-cart-button" type="button" class="relative grid size-11 place-items-center rounded-2xl bg-white text-slate-700 shadow-sm ring-1 ring-slate-200 transition active:scale-95" aria-label="Open Trolley">
              <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" aria-hidden="true"><path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L20 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
              <span id="header-cart-count" class="absolute -right-1 -top-1 hidden min-w-5 rounded-full bg-violet-600 px-1.5 py-0.5 text-[10px] font-black text-white">0</span>
            </button>
          </div>
        </div>
      </header>

      <main id="screen" class="min-h-[calc(100dvh-9.75rem)] pb-32" aria-live="polite"></main>

      <nav class="fixed inset-x-0 bottom-0 z-40 mx-auto max-w-3xl border-t border-slate-200/80 bg-white/95 px-1 pb-safe shadow-[0_-14px_40px_-28px_rgba(15,23,42,.45)] backdrop-blur-xl" aria-label="Primary navigation">
        <div class="grid h-[5.25rem] grid-cols-5 items-center">
          <button class="nav-item" type="button" data-route="market" aria-label="Market"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L20 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg></span><span>Market</span></button>
          <button class="nav-item" type="button" data-route="list" aria-label="Checklist">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="5" cy="6" r="1.8" />
                <line x1="10" y1="6" x2="20" y2="6" />
                <circle cx="5" cy="12" r="1.8" />
                <line x1="10" y1="12" x2="20" y2="12" />
                <circle cx="5" cy="18" r="1.8" />
                <line x1="10" y1="18" x2="20" y2="18" />
              </svg>
            </span>
            <span>List</span>
          </button>
          <button class="nav-item" type="button" data-route="trolley" aria-label="Trolley & Scanner"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 9v6M10 9v6M14 9v6M17 9v6"/></svg></span><span>Trolley</span></button>
          <button class="nav-item" type="button" data-route="tracker" aria-label="Order tracker"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span>Tracker</span></button>
          <button class="nav-item" type="button" data-route="savings" aria-label="Savings"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 12 12 20l-8-8V4h8l8 8Z"/><circle cx="8.5" cy="8.5" r="1.2"/></svg></span><span>Savings</span></button>
        </div>
      </nav>

      <div id="modal-root"></div>
      <div id="toast" class="pointer-events-none fixed inset-x-4 top-24 z-[70] mx-auto hidden max-w-sm -translate-y-2 rounded-2xl bg-slate-950 px-4 py-3 text-sm font-bold text-white opacity-0 shadow-2xl transition-all" role="alert" aria-live="assertive"></div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
