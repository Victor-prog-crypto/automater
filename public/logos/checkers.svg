<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="100%" height="100%">
  <defs>
    <linearGradient id="checkers-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005238"/>
      <stop offset="100%" stop-color="#003926"/>
    </linearGradient>
    <filter id="c-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="360" height="100" rx="18" fill="url(#checkers-green)"/>
  
  <!-- Subtle Teal Border Ring -->
  <rect x="6" y="6" width="348" height="88" rx="14" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Checkers Wordmark -->
  <g filter="url(#c-shadow)">
    <text x="180" y="58" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', sans-serif" 
          font-weight="900" 
          font-size="42" 
          letter-spacing="2.5" 
          text-anchor="middle">Checkers</text>
  </g>
  
  <!-- Sixty60 / Better and Better Accent Pill -->
  <g transform="translate(180, 78)">
    <rect x="-85" y="-10" width="170" height="18" rx="9" fill="#00b074"/>
    <text x="0" y="3" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="9" 
          letter-spacing="1.8" 
          text-anchor="middle">BETTER AND BETTER</text>
  </g>
</svg>
